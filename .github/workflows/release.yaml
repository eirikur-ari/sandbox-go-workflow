name: Release

on:
  push:
    branches:
      - master
      - "release/**"
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'
      - '.devcontainer/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.2.3
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      releasable: ${{ steps.validate.outputs.releasable }}
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Release
        id: validate
        run: bash .github/scripts/validate-release.sh release

  validation:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        # TODO: fetch-depth: 0 - We need to fetch all history so that we can check if the tag already exists.

      - name: Branch
        run: bash .github/scripts/validate-release.sh branch
      
        # TODO: We should have a prior step or job that resolves the version changelog if not provided via input. This workflow should not continue if the version is not provided via input or cannot be resolved from the changelog.
      - name: Version Format
        run: bash .github/scripts/validate-release.sh version-format
 
        # TODO: Read from git repo, not through GitHub API
      - name: Tag Does Not Exist
        run: bash .github/scripts/validate-release.sh tag

        # TODO: Review this (should be in github specific script, not in generic script)
      - name: Notes
        run: bash .github/scripts/validate-release.sh release-notes

  static-analysis:
    name: Static analysis
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
         go-version-file: go.mod
     #    cache-dependency-path: go.mod

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

  test:
    name: Test
    needs: [validation, static-analysis]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] #, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: make test

  build:
    name: Build
    needs: [version, validation, static-analysis, test]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
        #  cache-dependency-path: go.mod

      - name: Build
        run: make build-all

      - name: Package
        run: make package

      - name: Upload Archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: build/dist
          retention-days: ${{ needs.version.outputs.releasable == 'true' && 30 || 1 }}

  acceptance:
    name: Acceptance Test
    needs: [validation, static-analysis, test, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] #, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: build/dist

      - name: Extract Archive
        run: bash scripts/acceptance-test.sh extract

      - name: Acceptance Test
        run: make test-acceptance
        env:
          DUMMY_BINARY: ${{ github.workspace }}/build/acceptance/dummy # TODO: This should be resolved by convention, not hardcoded here. The acceptance test should not know about the dummy project.

  # TODO: attestation:

  # TODO: publication: